name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, codex/daily-pl-sheets-sync]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate embedded JavaScript and Apps Script
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text()
          match = re.search(r'<script>(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit('No app script found')
          Path('/tmp/app.js').write_text(match.group(1))
          Path('/tmp/sheets.js').write_text(Path('scripts/Code.gs').read_text())
          PY
          node --check /tmp/app.js
          node --check /tmp/sheets.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: so-chung-khoan-apk
          path: app/build/outputs/apk/debug/app-debug.apk
